spring.application.name=MediTek
server.port=8080

# Database credentials and the JWT signing key must be provided by the
# deployment environment. The application never creates a fallback database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
meditek.security.bcrypt-strength=${MEDITEK_BCRYPT_STRENGTH:12}

# JWT signing material must be a high-entropy secret of at least 256 bits.
meditek.jwt.secret=${MEDITEK_JWT_SECRET}
meditek.jwt.expiration-ms=${MEDITEK_JWT_EXPIRATION_MS:86400000}
meditek.cors.allowed-origins=${MEDITEK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Email notifications & SMTP configuration
meditek.mail.host=${MEDITEK_SMTP_HOST:smtp.gmail.com}
meditek.mail.port=${MEDITEK_SMTP_PORT:587}
meditek.mail.username=${MEDITEK_SMTP_USERNAME:sanjanascw13@gmail.com}
