          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDTO'
        '404':
          description: Patient not found

  /patients/{patientId}/history:
    get:
      tags: [Patients]
      summary: Get full clinical history (Doctor must be assigned to patient)
      operationId: getPatientFullHistory
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full history (records, prescriptions, lab results)
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient:
                    $ref: '#/components/schemas/PatientDTO'
                  medicalRecords:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicalRecordDTO'
                  prescriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrescriptionDTO'
                  labReports:
                    type: array
                    items:
                      $ref: '#/components/schemas/LabTestDTO'
        '403':
          description: Access Denied. Doctor is not assigned to this patient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

