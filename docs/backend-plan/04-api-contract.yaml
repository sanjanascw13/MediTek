      security:
        - bearerAuth: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPatientRequest'
      responses:
        '201':
          description: Transfer complete. Returns newly created active admission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDTO'
        '409':
          description: Conflict. Target bed is not available.
          content:
            application/json:
