          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillDTO'
    post:
      tags: [Billing]
      summary: Issue patient bill
      operationId: createBill
      security:
        - bearerAuth: []
      requestBody:
        required: true
