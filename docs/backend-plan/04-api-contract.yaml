openapi: 3.0.3
info:
  title: MediTek Hospital Information Management System API
  description: |
    REST API contract for the MediTek Object-Oriented Hospital Information Management System.
    Provides standard JSON endpoints for patient management, clinical operations, resource tracking,
    and departmental workflows. Route and DTO definitions reflect current Spring controllers;
    role and patient-ownership rules are summarized in docs/backend-plan/06-security-and-roles.md.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Current Spring Boot controller prefix (live server not runtime-verified)

tags:
  - name: Authentication
    description: User login, token issuance, and patient self-registration
  - name: Dashboard
    description: Current dashboard API responses (demo/baseline data only)
  - name: Patients
    description: Patient demographics, medical profiles, and history
  - name: Doctors & Staff
    description: Medical practitioners, nursing, and administrative personnel
  - name: Departments
    description: Hospital operational divisions and 10 specialized department subtypes
  - name: Appointments
    description: Outpatient doctor consultations scheduling and tracking
  - name: Wards & Beds
    description: Ward infrastructure and inpatient bed inventory
  - name: Admissions
    description: Bed assignments, inpatient transfers, and patient discharge lifecycle
  - name: Medical Records
    description: Diagnoses, treatment notes, and patient clinical records
  - name: Pharmacy
    description: Medication inventory, stock alerts, and prescriptions
  - name: Laboratory
    description: Diagnostic test ordering and laboratory report publishing
  - name: Surgeries
    description: Operating theater scheduling and surgical procedures
  - name: Blood Bank
    description: Blood group inventories and transfusion tracking
  - name: Billing
    description: Inpatient and outpatient invoice generation and payments
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token obtained from /auth/login

  parameters:
    BillId:
      name: billId
      in: path
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-23T04:15:00Z"
        status:
          type: integer
          example: 409
        error:
          type: string
          example: "Conflict"
        message:
          type: string
          example: "Bed BED-0102 is currently OCCUPIED by active admission ADM-0015."
        path:
          type: string
          example: "/api/admissions"
          fieldErrors:
            type: object
            additionalProperties:
              type: string
            description: Present for bean-validation failures; maps field names to validation messages.

    ValidationError:
      type: object
      required:
        - field
        - rejectedValue
        - message
      properties:
        field:
          type: string
          example: "phoneNumber"
        rejectedValue:
          type: string
          example: "123"
        message:
          type: string
          example: "Phone number must be exactly 10 digits."

    PageMetadata:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
        - last
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
        last:
          type: boolean
          example: false

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "doctor.sarah"
        password:
          type: string
          format: password
          example: "Password123!"

    AuthResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - username
        - role
        - name
        - passwordChangeRequired
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 86400
        username:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, DOCTOR, STAFF, PATIENT]
          description: Legacy ADMIN accounts are returned as SUPER_ADMIN.
        personId:
          type: string
          nullable: true
        name:
          type: string
        passwordChangeRequired:
          type: boolean

    UserAccountDTO:
      type: object
      required:
        - userId
        - username
        - email
        - role
      properties:
        userId:
          type: string
          example: "USR-0001"
        username:
          type: string
          example: "doctor.sarah"
        email:
          type: string
          format: email
          example: "sarah.smith@meditek.local"
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, DOCTOR, STAFF, PATIENT]
          example: "DOCTOR"
        personId:
          type: string
          example: "PER-0002"

    PatientRegisterRequest:
      type: object
      required:
        - name
        - dateOfBirth
        - gender
        - phoneNumber
        - email
        - bloodGroup
        - address
        - emergencyContact
        - username
        - password
      properties:
        name:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          example: "MALE"
        phoneNumber:
          type: string
          example: "0771234567"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        bloodGroup:
          type: string
          enum: ["A+", "O+", "B+", "AB+", "A-", "O-", "B-", "AB-"]
          example: "O+"
        address:
          type: string
          example: "123 Galle Road, Colombo 03"
        emergencyContact:
          type: string
          example: "0779876543"
        username:
          type: string
          example: "john.doe"
        password:
          type: string
          format: password
          example: "PatientSecure123!"

    PatientDTO:
      type: object
      required:
        - personId
        - patientId
        - name
        - dateOfBirth
        - gender
        - phoneNumber
        - email
        - bloodGroup
        - address
        - emergencyContact
      properties:
        personId:
          type: string
          example: "PER-0001"
        patientId:
          type: string
          example: "PAT-0001"
        name:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          example: "MALE"
        phoneNumber:
          type: string
          example: "0771234567"
        email:
          type: string
          example: "john.doe@example.com"
        bloodGroup:
          type: string
          example: "O+"
        address:
          type: string
          example: "123 Galle Road, Colombo 03"
        emergencyContact:
          type: string
          example: "0779876543"
        isActive:
          type: boolean
          nullable: true

    PatientRegistrationResponse:
      type: object
      required: [patient, username, temporaryPassword]
      properties:
        patient:
          $ref: '#/components/schemas/PatientDTO'
        username:
          type: string
        temporaryPassword:
          type: string
          description: Returned once at account provisioning; never stored as plaintext.

    PatientCreateRequest:
      type: object
      required:
        - name
        - dateOfBirth
        - gender
        - phoneNumber
        - email
        - bloodGroup
        - address
        - emergencyContact
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 128
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        phoneNumber:
          type: string
          pattern: '^0[0-9]{9}$'
        email:
          type: string
          format: email
          maxLength: 128
        bloodGroup:
          type: string
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
        address:
          type: string
          maxLength: 255
        emergencyContact:
          type: string
          pattern: '^0[0-9]{9}$'

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12

    DoctorDTO:
      type: object
      required:
        - personId
        - doctorId
        - name
        - specialization
        - licenseNumber
      properties:
        personId:
          type: string
          example: "PER-0002"
        doctorId:
          type: string
          example: "DOC-0001"
        name:
          type: string
          example: "Dr. Sarah Smith"
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        specialization:
          type: string
          example: "Cardiology"
        licenseNumber:
          type: string
          example: "SLMC-45920"
        phoneNumber:
          type: string
          example: "0712345678"
        email:
          type: string
          format: email
          example: "sarah.smith@meditek.local"
        departmentId:
          type: string
          example: "DEP-0003"
        departmentName:
          type: string
          example: "Outpatient Department"
        isActive:
          type: boolean
        username:
          type: string
          description: Provisioned username; may be absent from list responses.
        temporaryPassword:
          type: string
          description: Returned once when an account is provisioned.

    DoctorCreateRequest:
      type: object
      required: [name, dateOfBirth, gender, phoneNumber, email, specialization, licenseNumber]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 128
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        phoneNumber:
          type: string
          pattern: '^0[0-9]{9}$'
        email:
          type: string
          format: email
          maxLength: 128
        specialization:
          type: string
          minLength: 2
          maxLength: 64
        licenseNumber:
          type: string
          minLength: 5
          maxLength: 64
        departmentId:
          type: string

    MedicalStaffDTO:
      type: object
      required:
        - personId
        - staffId
        - name
        - role
      properties:
        personId:
          type: string
          example: "PER-0003"
        staffId:
          type: string
          example: "STF-0001"
        name:
          type: string
          example: "Nurse Emily Clarke"
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          example: "Head Nurse"
        departmentId:
          type: string
        departmentName:
          type: string
          example: "Intensive Care Unit"
        isActive:
          type: boolean
        username:
          type: string
        temporaryPassword:
          type: string
          description: Returned once when an account is provisioned.

    StaffCreateRequest:
      type: object
      required: [name, dateOfBirth, gender, phoneNumber, email, role]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 128
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        phoneNumber:
          type: string
          pattern: '^0[0-9]{9}$'
        email:
          type: string
          format: email
          maxLength: 128
        role:
          type: string
          minLength: 2
          maxLength: 64
        departmentId:
          type: string

    DepartmentDTO:
      type: object
      required:
        - departmentId
        - departmentName
        - location
      properties:
        departmentId:
          type: string
          example: "DEP-0002"
        departmentName:
          type: string
          example: "Intensive Care Unit"
        location:
          type: string
          example: "Block B, 3rd Floor"
        subtype:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true

    DepartmentCreateRequest:
      type: object
      required: [departmentName, location]
      properties:
        departmentName:
          type: string
        location:
          type: string
        subtype:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true

    AppointmentDTO:
      type: object
      required:
        - appointmentId
        - patientPersonId
        - patientName
        - doctorPersonId
        - doctorName
        - appointmentDate
        - status
      properties:
        appointmentId:
          type: string
          example: "APT-0001"
        patientPersonId:
          type: string
          example: "PER-000001"
        patientName:
          type: string
          example: "John Doe"
        doctorPersonId:
          type: string
          example: "PER-000002"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        appointmentDate:
          type: string
          format: date-time
          example: "2026-10-25T09:30:00Z"
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED, NO_SHOW]
          example: "SCHEDULED"
        notes:
          type: string
          nullable: true

    AppointmentCreateRequest:
      type: object
      required:
        - doctorPersonId
        - appointmentDate
      properties:
        patientPersonId:
          type: string
          description: Required for Staff/Super Admin; ignored for the authenticated Patient.
          example: "PER-000001"
        doctorPersonId:
          type: string
          example: "PER-000002"
        appointmentDate:
          type: string
          format: date-time
          example: "2026-10-25T09:30:00Z"
        notes:
          type: string
          nullable: true

    WardDTO:
      type: object
      required:
        - wardId
        - wardName
        - wardType
        - totalBeds
        - availableBeds
        - occupiedBeds
      properties:
        wardId:
          type: string
          example: "WRD-0001"
        wardName:
          type: string
          example: "Ward 4A - Surgical Post-Op"
        wardType:
          type: string
          example: "SURGICAL"
        totalBeds:
          type: integer
          example: 20
        availableBeds:
          type: integer
          example: 6
        occupiedBeds:
          type: integer
          example: 12
        maintenanceBeds:
          type: integer
        unavailableBeds:
          type: integer

    WardCreateRequest:
      type: object
      required: [wardName, wardType]
      properties:
        wardName:
          type: string
          minLength: 2
          maxLength: 128
        wardType:
          type: string
          minLength: 2
          maxLength: 64

    BedDTO:
      type: object
      required:
        - bedId
        - wardId
        - wardName
        - bedNumber
        - availabilityStatus
      properties:
        bedId:
          type: string
          example: "BED-0102"
        wardId:
          type: string
          example: "WRD-0001"
        wardName:
          type: string
          example: "Ward 4A - Surgical Post-Op"
        bedNumber:
          type: string
          example: "Bed 02"
        availabilityStatus:
          type: string
          description: OCCUPIED is a derived state; operational status is stored separately.
          example: "AVAILABLE"
        operationalStatus:
          type: string
          enum: [AVAILABLE, MAINTENANCE, UNAVAILABLE]
        currentPatientName:
          type: string
          nullable: true
          example: null

    BedCreateRequest:
      type: object
      required: [wardId, bedNumber]
      properties:
        wardId:
          type: string
        bedNumber:
          type: string
          minLength: 1
          maxLength: 32

    BedStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [AVAILABLE, MAINTENANCE, UNAVAILABLE]
          example: "MAINTENANCE"

    AdmissionDTO:
      type: object
      required:
        - admissionId
        - patientPersonId
        - patientName
        - bedId
        - bedNumber
        - wardName
        - admittingDoctorPersonId
        - admittingDoctorName
        - admissionDate
        - status
      properties:
        admissionId:
          type: string
          example: "ADM-0001"
        patientPersonId:
          type: string
          example: "PER-000001"
        patientName:
          type: string
          example: "John Doe"
        bedId:
          type: string
          example: "BED-0102"
        bedNumber:
          type: string
          example: "Bed 02"
        wardName:
          type: string
          example: "Ward 4A - Surgical Post-Op"
        wardId:
          type: string
        admittingDoctorPersonId:
          type: string
          example: "PER-000002"
        admittingDoctorName:
          type: string
          example: "Dr. Sarah Smith"
        admissionDate:
          type: string
          format: date-time
          example: "2026-10-22T14:00:00Z"
        dischargeDate:
          type: string
          format: date-time
          nullable: true
          example: null
        status:
          type: string
          enum: [ACTIVE, DISCHARGED, TRANSFERRED]
          example: "ACTIVE"
        reason:
          type: string
          example: "Post-operative monitoring after laparoscopic appendectomy."
        transferFromAdmissionId:
          type: string
          nullable: true
          example: null

    AdmitPatientRequest:
      type: object
      required:
        - patientPersonId
        - bedId
        - admittingDoctorPersonId
      properties:
        patientPersonId:
          type: string
          example: "PER-000001"
        bedId:
          type: string
          example: "BED-0102"
        admittingDoctorPersonId:
          type: string
          example: "PER-000002"
        reason:
          type: string
          example: "Acute febrile illness requiring inpatient IV hydration."

    TransferPatientRequest:
      type: object
      required:
        - currentAdmissionId
        - targetBedId
      properties:
        currentAdmissionId:
          type: string
          example: "ADM-0001"
        targetBedId:
          type: string
          example: "BED-0205"
        reason:
          type: string
          example: "Transferring from ETU observation to Surgical Post-Op Ward."

    MedicalRecordDTO:
      type: object
      required:
        - recordId
        - patientId
        - patientName
        - content
        - createdAt
      properties:
        recordId:
          type: string
          example: "REC-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "Alex Doe"
        authorId:
          type: string
          nullable: true
          description: Readable Doctor or Staff business ID.
        authorName:
          type: string
          nullable: true
        appointmentId:
          type: string
          nullable: true
          example: "APT-0001"
        admissionId:
          type: string
          nullable: true
          example: "ADM-0001"
        content:
          type: string
          maxLength: 10000
          description: Immutable clinical note content stored by the existing model.
        createdAt:
          type: string
          format: date-time
          example: "2026-10-20T10:15:00Z"

    MedicalRecordCreateRequest:
      type: object
      required: [patientId, content]
      properties:
        patientId:
          type: string
          example: "PAT-0001"
        appointmentId:
          type: string
          nullable: true
        admissionId:
          type: string
          nullable: true
        content:
          type: string
          minLength: 1
          maxLength: 10000

    BillLineItemDTO:
      type: object
      required: [lineItemId, description, quantity, unitPrice, lineTotal]
      properties:
        lineItemId:
          type: string
          example: "BLI-000001"
        description:
          type: string
          maxLength: 255
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double
          multipleOf: 0.01
        lineTotal:
          type: number
          format: double
          multipleOf: 0.01

    BillLineItemRequest:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01

    BillPaymentDTO:
      type: object
      required: [paymentId, amount, paymentMethod, recordedBy, paidAt]
      properties:
        paymentId:
          type: string
          example: "PAY-000001"
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
        paymentMethod:
          type: string
          enum: [CASH, BANK_TRANSFER, OTHER]
        recordedBy:
          type: string
        paidAt:
          type: string
          format: date-time

    BillPaymentRequest:
      type: object
      required: [amount, paymentMethod, paymentRequestId]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
        paymentMethod:
          type: string
          enum: [CASH, BANK_TRANSFER, OTHER]
          description: No payment gateway or card data is accepted.
        paymentRequestId:
          type: string
          minLength: 1
          maxLength: 64
          description: Client-generated idempotency key to reject duplicate payment submissions.

    BillCreateRequest:
      type: object
      required: [patientId, items]
      properties:
        patientId:
          type: string
          example: "PAT-0001"
        admissionId:
          type: string
          nullable: true
        taxRatePercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          default: 0
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BillLineItemRequest'

    MedicineDTO:
      type: object
      required:
        - medicineId
        - medicineName
        - category
        - quantity
        - price
      properties:
        medicineId:
          type: string
          example: "MED-0001"
        medicineName:
          type: string
          example: "Amoxicillin 500mg"
        category:
          type: string
          example: "Antibiotics"
        quantity:
          type: integer
          minimum: 0
          example: 450
        price:
          type: number
          format: double
          example: 18.50

    PrescriptionCreateRequest:
      type: object
      required: [patientId, doctorId, items]
      properties:
        patientId:
          type: string
          example: "PAT-0001"
        doctorId:
          type: string
          example: "DOC-0001"
        instructions:
          type: string
          maxLength: 2000
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [medicineId, prescribedQuantity, dosage, frequency, durationDays]
            properties:
              medicineId:
                type: string
              prescribedQuantity:
                type: integer
                minimum: 1
              dosage:
                type: string
                maxLength: 64
              frequency:
                type: string
                maxLength: 64
              durationDays:
                type: integer
                minimum: 1

    PrescriptionDTO:
      type: object
      required:
        - prescriptionId
        - patientId
        - doctorId
        - doctorName
        - prescriptionDate
        - items
      properties:
        prescriptionId:
          type: string
          example: "PRE-0001"
        patientId:
          type: string
          example: "PAT-0001"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        prescriptionDate:
          type: string
          format: date-time
          example: "2026-10-21T11:00:00Z"
        instructions:
          type: string
          nullable: true
          example: "Take 1 capsule every 8 hours after meals for 5 consecutive days."
        items:
          type: array
          items:
            type: object
            required:
              - prescriptionItemId
              - medicineId
              - medicineName
              - prescribedQuantity
            properties:
              prescriptionItemId:
                type: string
                example: "PRI-0001"
              medicineId:
                type: string
                example: "MED-0001"
              medicineName:
                type: string
                example: "Amoxicillin 500mg"
              prescribedQuantity:
                type: integer
                example: 15
              quantityDispensed:
                type: integer
                example: 5
              remainingQuantity:
                type: integer
                example: 10
              dosage:
                type: string
              frequency:
                type: string
              durationDays:
                type: integer

    DispenseMedicineRequest:
      type: object
      required: [prescriptionItemId, quantity]
      properties:
        prescriptionItemId:
          type: string
          example: "PRI-0001"
        quantity:
          type: integer
          minimum: 1

    DispensationDTO:
      type: object
      required:
        - dispensationId
        - prescriptionId
        - prescriptionItemId
        - medicineId
        - patientId
        - quantity
        - unitPrice
        - dispensedAt
      properties:
        dispensationId:
          type: string
          example: "DSP-0001"
        prescriptionId:
          type: string
        prescriptionItemId:
          type: string
        medicineId:
          type: string
        medicineName:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        dispensedBy:
          type: string
        dispensedAt:
          type: string
          format: date-time

    LabTestDTO:
      type: object
      required:
        - testId
        - patientId
        - patientName
        - doctorId
        - doctorName
        - testName
        - testDate
        - status
      properties:
        testId:
          type: string
          example: "TST-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        testName:
          type: string
          example: "Full Blood Count (FBC)"
        testDate:
          type: string
          format: date-time
          example: "2026-10-22T08:00:00Z"
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED]
          example: "PENDING"
        reportId:
          type: string
          nullable: true
          example: "REP-0001"
        result:
          type: string
          nullable: true
          enum: [NORMAL, ABNORMAL]
          example: "NORMAL"

    LabTestCreateRequest:
      type: object
      required: [patientId, doctorId, testName]
      properties:
        patientId:
          type: string
        doctorId:
          type: string
        testName:
          type: string
          maxLength: 128

    LabTestStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CANCELLED]

    LabReportDTO:
      type: object
      required:
        - reportId
        - testId
        - reportDate
        - resultDetails
        - result
      properties:
        reportId:
          type: string
          example: "REP-0001"
        testId:
          type: string
          example: "TST-0001"
        reportDate:
          type: string
          format: date-time
          example: "2026-10-22T12:30:00Z"
        resultDetails:
          type: string
          example: "WBC: 6.8 x10^9/L (Normal 4.0-11.0), Hb: 14.2 g/dL, Platelets: 245 x10^9/L. All parameters within normal reference ranges."
        result:
          type: string
          enum: [NORMAL, ABNORMAL]
        reviewingDoctorId:
          type: string
        reviewingDoctorName:
          type: string

    LabReportCreateRequest:
      type: object
      required: [resultDetails, result, reviewingDoctorId]
      properties:
        resultDetails:
          type: string
          maxLength: 4000
        result:
          type: string
          enum: [NORMAL, ABNORMAL]
        reviewingDoctorId:
          type: string
          description: Active Doctor who reviews the report; Doctors must submit their own Doctor ID.

    SurgeryDTO:
      type: object
      required:
        - surgeryId
        - patientId
        - patientName
        - doctorId
        - doctorName
        - theaterNumber
        - departmentName
        - scheduledAt
        - surgeryType
        - durationMinutes
        - status
      properties:
        surgeryId:
          type: string
          example: "SRG-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        theaterNumber:
          type: string
          example: "OT-01 Suite"
        departmentName:
          type: string
        scheduledAt:
          type: string
          format: date-time
          example: "2026-10-28T07:30:00Z"
        surgeryType:
          type: string
          maxLength: 128
          example: "Laparoscopic Cholecystectomy"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: "SCHEDULED"
        notes:
          type: string
          nullable: true

    SurgeryCreateRequest:
      type: object
      required: [patientId, theaterNumber, scheduledAt, surgeryType, durationMinutes]
      properties:
        patientId:
          type: string
        doctorId:
          type: string
          description: Required for Super Admin; Doctors are bound to their own profile.
        theaterNumber:
          type: string
        scheduledAt:
          type: string
          format: date-time
          description: Must be a future UTC timestamp.
        surgeryType:
          type: string
          maxLength: 128
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        notes:
          type: string
          maxLength: 4000

    SurgeryStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]

    OperatingTheaterDTO:
      type: object
      required: [theaterNumber, departmentName, location]
      properties:
        theaterNumber:
          type: string
        departmentName:
          type: string
        location:
          type: string

    BloodUnitDTO:
      type: object
      required:
        - unitId
        - bloodBankId
        - bloodBankName
        - bloodType
        - component
        - collectionDate
        - expirationDate
        - quantityMl
        - availabilityStatus
      properties:
        unitId:
          type: string
          example: "BLD-0001"
        bloodBankId:
          type: string
          example: "BB-01"
        bloodBankName:
          type: string
        bloodType:
          type: string
          example: "O+"
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
        component:
          type: string
          enum: [WHOLE_BLOOD, RED_CELLS, PLASMA, PLATELETS, CRYOPRECIPITATE]
        collectionDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        quantityMl:
          type: integer
          minimum: 0
          example: 10
        availabilityStatus:
          type: string
          enum: [AVAILABLE, DEPLETED, EXPIRED]
          example: "AVAILABLE"

    BloodBankDTO:
      type: object
      required: [bloodBankId, name, location]
      properties:
        bloodBankId:
          type: string
        name:
          type: string
        location:
          type: string

    BloodBankCreateRequest:
      type: object
      required: [name, location]
      properties:
        name:
          type: string
          maxLength: 128
        location:
          type: string
          maxLength: 128

    BloodUnitCreateRequest:
      type: object
      required: [bloodBankId, bloodType, component, collectionDate, expirationDate, quantityMl]
      properties:
        bloodBankId:
          type: string
        bloodType:
          type: string
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
        component:
          type: string
          enum: [WHOLE_BLOOD, RED_CELLS, PLASMA, PLATELETS, CRYOPRECIPITATE]
        collectionDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        quantityMl:
          type: integer
          minimum: 1

    BloodIssueCreateRequest:
      type: object
      required: [unitId, patientId, quantityMl]
      properties:
        unitId:
          type: string
        patientId:
          type: string
        quantityMl:
          type: integer
          minimum: 1
        purpose:
          type: string
          maxLength: 500

    BloodIssueDTO:
      type: object
      required: [bloodIssueId, unitId, bloodType, component, patientId, patientName, quantityMl, issuedBy, issuedAt]
      properties:
        bloodIssueId:
          type: string
        unitId:
          type: string
        bloodType:
          type: string
        component:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        quantityMl:
          type: integer
        purpose:
          type: string
          nullable: true
        issuedBy:
          type: string
        issuedAt:
          type: string
          format: date-time

    BillDTO:
      type: object
      required:
        - billId
        - patientId
        - patientName
        - items
        - subtotal
        - taxRatePercent
        - taxAmount
        - amountTotal
        - amountPaid
        - balanceDue
        - status
        - issuedAt
      properties:
        billId:
          type: string
          example: "BIL-000001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        admissionId:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillLineItemDTO'
        subtotal:
          type: number
          multipleOf: 0.01
        taxRatePercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
        taxAmount:
          type: number
          multipleOf: 0.01
        amountTotal:
          type: number
          multipleOf: 0.01
        amountPaid:
          type: number
          multipleOf: 0.01
        balanceDue:
          type: number
          minimum: 0
          multipleOf: 0.01
        status:
          type: string
          enum: [PENDING, PARTIAL, PAID, CANCELLED]
          example: "PENDING"
        issuedAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/BillPaymentDTO'

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and obtain JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Patient self-registration (Creates PATIENT account only)
      operationId: registerPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegisterRequest'
      responses:
        '201':
          description: Patient successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the authenticated account password
      description: Temporary-password accounts may access this endpoint before other protected API routes.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; no response body.
        '400':
          description: Password request validation failed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Retrieve dashboard statistics
      description: Current implementation returns baseline/demo figures rather than verified real-time hospital aggregates.
      operationId: getDashboardStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard totals and chart/operation summary data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newPatients:
                    type: integer
                    format: int64
                  appointments:
                    type: integer
                    format: int64
                  earning:
                    type: number
                    format: double
                  operations:
                    type: integer
                    format: int64
                  patientDistributions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  recentOperations:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /dashboard/patient-chart:
    get:
      tags: [Dashboard]
      summary: Retrieve patient distribution chart values
      description: Current implementation returns fixed demonstration chart data.
      operationId: getPatientChart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Chart category objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /patients:
    get:
      tags: [Patients]
      summary: List patients in the authenticated role's scope
      operationId: listPatients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient list; Doctors receive patients with an appointment in their care.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Patients]
      summary: Administratively register a new patient
      operationId: createPatient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '201':
          description: Patient created with an account and one-time temporary credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRegistrationResponse'

  /patients/me:
    get:
      tags: [Patients]
      summary: Retrieve current authenticated patient's profile
      operationId: getCurrentPatientProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDTO'
        '403':
          description: Caller is not a Patient account

  /patients/me/medical-records:
    get:
      tags: [Patients]
      summary: Retrieve current authenticated patient's medical history
      operationId: getCurrentPatientRecords
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient medical records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicalRecordDTO'

  /patients/me/bills:
    get:
      tags: [Patients]
      summary: Retrieve current patient's bills and payment statuses
      operationId: getCurrentPatientBills
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillDTO'

  /patients/{patientId}:
    get:
      tags: [Patients]
      summary: Get patient demographic details
      operationId: getPatientById
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDTO'
        '404':
          description: Patient not found
    delete:
      tags: [Patients]
      summary: Deactivate a patient and disable the associated account
      operationId: deactivatePatient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Patient deactivated.

  /doctors:
    get:
      tags: [Doctors & Staff]
      summary: List doctors
      operationId: listDoctors
      description: Returns active Doctors to clinical and patient roles; Super Admin can also see inactive Doctors for account reactivation.
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorDTO'
    post:
      tags: [Doctors & Staff]
      summary: Create a Doctor and account
      operationId: createDoctor
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorCreateRequest'
      responses:
        '201':
          description: Doctor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDTO'

  /doctors/{id}:
    get:
      tags: [Doctors & Staff]
      summary: Retrieve a Doctor by business or person ID
      operationId: getDoctor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Doctor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDTO'

  /doctors/{id}/status:
    patch:
      tags: [Doctors & Staff]
      summary: Activate or deactivate a Doctor
      operationId: setDoctorStatus
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: active
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Updated Doctor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDTO'

  /staff:
    get:
      tags: [Doctors & Staff]
      summary: List medical staff and nurses
      operationId: listStaff
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicalStaffDTO'
    post:
      tags: [Doctors & Staff]
      summary: Create Staff and an account
      operationId: createStaff
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
      responses:
        '201':
          description: Staff profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalStaffDTO'

  /staff/{id}:
    get:
      tags: [Doctors & Staff]
      summary: Retrieve Staff by business or person ID
      operationId: getStaff
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Staff profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalStaffDTO'

  /staff/{id}/status:
    patch:
      tags: [Doctors & Staff]
      summary: Activate or deactivate Staff
      operationId: setStaffStatus
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: active
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Updated Staff profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalStaffDTO'

  /departments:
    get:
      tags: [Departments]
      summary: List all 10 hospital department divisions
      operationId: listDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentDTO'
    post:
      tags: [Departments]
      summary: Create a department
      operationId: createDepartment
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateRequest'
      responses:
        '201':
          description: Department created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'

  /departments/{id}:
    get:
      tags: [Departments]
      summary: Retrieve a department
      operationId: getDepartment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
    delete:
      tags: [Departments]
      summary: Delete a department when no restricted relationships prevent deletion
      operationId: deleteDepartment
      description: Restricted to Super Admin; database foreign keys use RESTRICT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Department deleted.

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments within the authenticated role's scope
      operationId: listAppointments
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentDTO'
    post:
      tags: [Appointments]
      summary: Book a consultation appointment
      operationId: bookAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDTO'

  /appointments/{id}/status:
    patch:
      tags: [Appointments]
      summary: Update an appointment status
      description: Doctor may complete only an assigned appointment; Staff/Super Admin may update scheduled appointments.
      operationId: updateAppointmentStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [COMPLETED, CANCELLED, NO_SHOW]
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDTO'

  /wards:
    get:
      tags: [Wards & Beds]
      summary: List all hospital wards with bed count summaries
      operationId: listWards
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WardDTO'
    post:
      tags: [Wards & Beds]
      summary: Create a ward
      operationId: createWard
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardCreateRequest'
      responses:
        '201':
          description: Ward created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardDTO'

  /beds:
    get:
      tags: [Wards & Beds]
      summary: Query bed inventory and availability
      operationId: listBeds
      security:
        - bearerAuth: []
      parameters:
        - name: wardId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BedDTO'
    post:
      tags: [Wards & Beds]
      summary: Create a bed in a ward
      operationId: createBed
      description: Restricted to Super Admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedCreateRequest'
      responses:
        '201':
          description: Bed created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedDTO'

  /beds/{bedId}/status:
    patch:
      tags: [Wards & Beds]
      summary: Update bed availability status (e.g. flag for Maintenance)
      operationId: updateBedStatus
      security:
        - bearerAuth: []
      parameters:
        - name: bedId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedStatusUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedDTO'
        '409':
