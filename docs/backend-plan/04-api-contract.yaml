    put:
      tags: [Billing]
      summary: Update a line item before payment begins
      operationId: updateBillLineItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BillId'
        - name: lineItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillLineItemRequest'
      responses:
        '200':
          description: Invoice totals recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDTO'
        '409':
          description: Invoice is paid, cancelled, or has begun payment.
    delete:
      tags: [Billing]
      summary: Remove a line item before payment begins
      operationId: removeBillLineItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BillId'
        - name: lineItemId
          in: path
          required: true
          schema:
