      responses:
        '201':
          description: Payment recorded; invoice balance and status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDTO'
        '409':
          description: Duplicate payment request, invoice not payable, or amount exceeds balance.

responses:
  Unauthorized:
    description: Full authentication required (Missing or expired JWT)
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  Forbidden:
    description: Access Denied (Insufficient role privileges)
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
