      operationId: listAdmissions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DISCHARGED, TRANSFERRED]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdmissionDTO'
    post:
      tags: [Admissions]
      summary: Admit a patient to an available bed
      operationId: admitPatient
