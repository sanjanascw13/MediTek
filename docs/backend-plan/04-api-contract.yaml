openapi: 3.0.3
info:
  title: MediTek Hospital Information Management System API
  description: |
    REST API contract for the MediTek Object-Oriented Hospital Information Management System.
    Provides standard JSON endpoints for patient management, clinical operations, resource tracking,
    and departmental workflows.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot Development Server

tags:
  - name: Authentication
    description: User login, token issuance, and patient self-registration
  - name: Patients
    description: Patient demographics, medical profiles, and history
  - name: Doctors & Staff
    description: Medical practitioners, nursing, and administrative personnel
  - name: Departments
    description: Hospital operational divisions and 10 specialized department subtypes
  - name: Appointments
    description: Outpatient doctor consultations scheduling and tracking
  - name: Wards & Beds
    description: Ward infrastructure and inpatient bed inventory
  - name: Admissions
    description: Bed assignments, inpatient transfers, and patient discharge lifecycle
  - name: Medical Records
    description: Diagnoses, treatment notes, and patient clinical records
  - name: Pharmacy
    description: Medication inventory, stock alerts, and prescriptions
  - name: Laboratory
    description: Diagnostic test ordering and laboratory report publishing
  - name: Surgeries
    description: Operating theater scheduling and surgical procedures
  - name: Blood Bank
    description: Blood group inventories and transfusion tracking
  - name: Billing
    description: Inpatient and outpatient invoice generation and payments
  - name: Tier 2 Workflows
    description: Radiology, Maternity, ETU, Clinic, and Medical Unit specialized workflows

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token obtained from /auth/login

  schemas:
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-23T04:15:00Z"
        status:
          type: integer
          example: 409
        error:
          type: string
          example: "Conflict"
        message:
          type: string
          example: "Bed BED-0102 is currently OCCUPIED by active admission ADM-0015."
        path:
          type: string
          example: "/api/v1/admissions"
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required:
        - field
        - rejectedValue
        - message
      properties:
        field:
          type: string
          example: "phoneNumber"
        rejectedValue:
          type: string
          example: "123"
        message:
          type: string
          example: "Phone number must be exactly 10 digits."

    PageMetadata:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
        - last
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
        last:
          type: boolean
          example: false

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "doctor.sarah"
        password:
          type: string
          format: password
          example: "Password123!"

    AuthResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 86400
        user:
          $ref: '#/components/schemas/UserAccountDTO'

    UserAccountDTO:
      type: object
      required:
        - userId
        - username
        - email
        - role
      properties:
        userId:
          type: string
          example: "USR-0001"
        username:
          type: string
          example: "doctor.sarah"
        email:
          type: string
          format: email
          example: "sarah.smith@meditek.local"
        role:
          type: string
          enum: [ADMIN, DOCTOR, STAFF, PATIENT]
          example: "DOCTOR"
        personId:
          type: string
          example: "PER-0002"

    PatientRegisterRequest:
      type: object
      required:
        - name
        - dateOfBirth
        - gender
        - phoneNumber
        - email
        - bloodGroup
        - address
        - emergencyContact
        - username
        - password
      properties:
        name:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          example: "MALE"
        phoneNumber:
          type: string
          example: "0771234567"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        bloodGroup:
          type: string
          enum: ["A+", "O+", "B+", "AB+", "A-", "O-", "B-", "AB-"]
          example: "O+"
        address:
          type: string
          example: "123 Galle Road, Colombo 03"
        emergencyContact:
          type: string
          example: "0779876543"
        username:
          type: string
          example: "john.doe"
        password:
          type: string
          format: password
          example: "PatientSecure123!"

    PatientDTO:
      type: object
      required:
        - personId
        - patientId
        - name
        - dateOfBirth
        - gender
        - phoneNumber
        - email
        - bloodGroup
        - address
        - emergencyContact
      properties:
        personId:
          type: string
          example: "PER-0001"
        patientId:
          type: string
          example: "PAT-0001"
        name:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          example: "MALE"
        phoneNumber:
          type: string
          example: "0771234567"
        email:
          type: string
          example: "john.doe@example.com"
        bloodGroup:
          type: string
          example: "O+"
        address:
          type: string
          example: "123 Galle Road, Colombo 03"
        emergencyContact:
          type: string
          example: "0779876543"

    DoctorDTO:
      type: object
      required:
        - personId
        - doctorId
        - name
        - specialization
        - licenseNumber
      properties:
        personId:
          type: string
          example: "PER-0002"
        doctorId:
          type: string
          example: "DOC-0001"
        name:
          type: string
          example: "Dr. Sarah Smith"
        specialization:
          type: string
          example: "Cardiology"
        licenseNumber:
          type: string
          example: "SLMC-45920"
        phoneNumber:
          type: string
          example: "0712345678"
        email:
          type: string
          example: "sarah.smith@meditek.local"
        departmentId:
          type: string
          example: "DEP-0003"
        departmentName:
          type: string
          example: "Outpatient Department"

    MedicalStaffDTO:
      type: object
      required:
        - personId
        - staffId
        - name
        - role
        - departmentName
      properties:
        personId:
          type: string
          example: "PER-0003"
        staffId:
          type: string
          example: "STF-0001"
        name:
          type: string
          example: "Nurse Emily Clarke"
        role:
          type: string
          example: "Head Nurse"
        departmentName:
          type: string
          example: "Intensive Care Unit"
        shift:
          type: string
          enum: [MORNING, EVENING, NIGHT]
          example: "MORNING"

    DepartmentDTO:
      type: object
      required:
        - departmentId
        - departmentName
        - location
        - type
      properties:
        departmentId:
          type: string
          example: "DEP-0002"
        departmentName:
          type: string
          example: "Intensive Care Unit"
        location:
          type: string
          example: "Block B, 3rd Floor"
        type:
          type: string
          enum: [ETU, ICU, OPD, LABORATORY, PHARMACY, RADIOLOGY, OPERATING_THEATER, MATERNITY, CLINIC, MEDICAL_UNIT]
          example: "ICU"
        specificField:
          type: string
          description: Subtype field value (e.g. bedCapacity, consultationRoomCount, theaterNumber)
          example: "16"

    AppointmentDTO:
      type: object
      required:
        - appointmentId
        - patientId
        - patientName
        - doctorId
        - doctorName
        - appointmentDate
        - status
      properties:
        appointmentId:
          type: string
          example: "APT-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        appointmentDate:
          type: string
          format: date-time
          example: "2026-10-25T09:30:00Z"
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED, NO_SHOW]
          example: "SCHEDULED"

    AppointmentCreateRequest:
      type: object
      required:
        - patientId
        - doctorId
        - appointmentDate
      properties:
        patientId:
          type: string
          example: "PAT-0001"
        doctorId:
          type: string
          example: "DOC-0001"
        appointmentDate:
          type: string
          format: date-time
          example: "2026-10-25T09:30:00Z"

    WardDTO:
      type: object
      required:
        - wardId
        - wardName
        - wardType
        - totalBeds
        - availableBeds
        - occupiedBeds
      properties:
        wardId:
          type: string
          example: "WRD-0001"
        wardName:
          type: string
          example: "Ward 4A - Surgical Post-Op"
        wardType:
          type: string
          example: "SURGICAL"
        totalBeds:
          type: integer
          example: 20
        availableBeds:
          type: integer
          example: 6
        occupiedBeds:
          type: integer
          example: 12

    BedDTO:
      type: object
      required:
        - bedId
        - wardId
        - wardName
        - bedNumber
        - availabilityStatus
      properties:
        bedId:
          type: string
          example: "BED-0102"
        wardId:
          type: string
          example: "WRD-0001"
        wardName:
          type: string
          example: "Ward 4A - Surgical Post-Op"
        bedNumber:
          type: string
          example: "Bed 02"
        availabilityStatus:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE, UNAVAILABLE]
          example: "AVAILABLE"
        currentPatientName:
          type: string
          nullable: true
          example: null

    BedStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [AVAILABLE, MAINTENANCE, UNAVAILABLE]
          example: "MAINTENANCE"
        reason:
          type: string
          example: "Routine sanitization and electrical maintenance."

    AdmissionDTO:
      type: object
      required:
        - admissionId
        - patientId
        - patientName
        - bedId
        - bedNumber
        - wardName
        - doctorId
        - doctorName
        - admissionDate
        - status
      properties:
        admissionId:
          type: string
          example: "ADM-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        bedId:
          type: string
          example: "BED-0102"
        bedNumber:
          type: string
          example: "Bed 02"
        wardName:
          type: string
          example: "Ward 4A - Surgical Post-Op"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        admissionDate:
          type: string
          format: date-time
          example: "2026-10-22T14:00:00Z"
        dischargeDate:
          type: string
          format: date-time
          nullable: true
          example: null
        status:
          type: string
          enum: [ACTIVE, DISCHARGED, TRANSFERRED]
          example: "ACTIVE"
        reason:
          type: string
          example: "Post-operative monitoring after laparoscopic appendectomy."
        transferFromAdmissionId:
          type: string
          nullable: true
          example: null

    AdmitPatientRequest:
      type: object
      required:
        - patientId
        - bedId
        - doctorId
        - reason
      properties:
        patientId:
          type: string
          example: "PAT-0001"
        bedId:
          type: string
          example: "BED-0102"
        doctorId:
          type: string
          example: "DOC-0001"
        reason:
          type: string
          example: "Acute febrile illness requiring inpatient IV hydration."

    TransferPatientRequest:
      type: object
      required:
        - targetBedId
        - reason
      properties:
        targetBedId:
          type: string
          example: "BED-0205"
        reason:
          type: string
          example: "Transferring from ETU observation to Surgical Post-Op Ward."

    MedicalRecordDTO:
      type: object
      required:
        - recordId
        - patientId
        - doctorId
        - doctorName
        - diagnosis
        - treatment
        - recordDate
      properties:
        recordId:
          type: string
          example: "REC-0001"
        patientId:
          type: string
          example: "PAT-0001"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        appointmentId:
          type: string
          nullable: true
          example: "APT-0001"
        diagnosis:
          type: string
          example: "Type II Diabetes Mellitus with mild peripheral neuropathy"
        treatment:
          type: string
          example: "Metformin 500mg BD; dietary lifestyle modification; 3-month HbA1c review"
        recordDate:
          type: string
          format: date-time
          example: "2026-10-20T10:15:00Z"

    MedicineDTO:
      type: object
      required:
        - medicineId
        - medicineName
        - category
        - quantity
        - price
      properties:
        medicineId:
          type: string
          example: "MED-0001"
        medicineName:
          type: string
          example: "Amoxicillin 500mg"
        category:
          type: string
          example: "Antibiotics"
        quantity:
          type: integer
          example: 450
        price:
          type: number
          format: double
          example: 18.50

    PrescriptionDTO:
      type: object
      required:
        - prescriptionId
        - patientId
        - doctorId
        - doctorName
        - prescriptionDate
        - instructions
        - items
      properties:
        prescriptionId:
          type: string
          example: "PRE-0001"
        patientId:
          type: string
          example: "PAT-0001"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        prescriptionDate:
          type: string
          format: date-time
          example: "2026-10-21T11:00:00Z"
        instructions:
          type: string
          example: "Take 1 capsule every 8 hours after meals for 5 consecutive days."
        items:
          type: array
          items:
            type: object
            required:
              - medicineId
              - medicineName
              - prescribedQuantity
            properties:
              medicineId:
                type: string
                example: "MED-0001"
              medicineName:
                type: string
                example: "Amoxicillin 500mg"
              prescribedQuantity:
                type: integer
                example: 15

    LabTestDTO:
      type: object
      required:
        - testId
        - patientId
        - patientName
        - doctorId
        - doctorName
        - testName
        - testDate
        - result
      properties:
        testId:
          type: string
          example: "TST-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        testName:
          type: string
          example: "Full Blood Count (FBC)"
        testDate:
          type: string
          format: date-time
          example: "2026-10-22T08:00:00Z"
        result:
          type: string
          enum: [PENDING, NORMAL, ABNORMAL]
          example: "NORMAL"
        reportId:
          type: string
          nullable: true
          example: "REP-0001"

    LabReportDTO:
      type: object
      required:
        - reportId
        - testId
        - reportDate
        - resultDetails
      properties:
        reportId:
          type: string
          example: "REP-0001"
        testId:
          type: string
          example: "TST-0001"
        reportDate:
          type: string
          format: date-time
          example: "2026-10-22T12:30:00Z"
        resultDetails:
          type: string
          example: "WBC: 6.8 x10^9/L (Normal 4.0-11.0), Hb: 14.2 g/dL, Platelets: 245 x10^9/L. All parameters within normal reference ranges."

    SurgeryDTO:
      type: object
      required:
        - surgeryId
        - patientId
        - patientName
        - doctorId
        - doctorName
        - theaterNumber
        - surgeryDate
        - surgeryType
        - status
      properties:
        surgeryId:
          type: string
          example: "SRG-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        doctorId:
          type: string
          example: "DOC-0001"
        doctorName:
          type: string
          example: "Dr. Sarah Smith"
        theaterNumber:
          type: string
          example: "OT-01 Suite"
        surgeryDate:
          type: string
          format: date-time
          example: "2026-10-28T07:30:00Z"
        surgeryType:
          type: string
          example: "Laparoscopic Cholecystectomy"
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: "SCHEDULED"

    BloodUnitDTO:
      type: object
      required:
        - bloodId
        - bloodBankId
        - bloodGroup
        - quantity
        - availabilityStatus
      properties:
        bloodId:
          type: string
          example: "BLD-0001"
        bloodBankId:
          type: string
          example: "BB-01"
        bloodGroup:
          type: string
          example: "O+"
        quantity:
          type: integer
          example: 10
        availabilityStatus:
          type: string
          enum: [AVAILABLE, RESERVED, DISPENSED, EXPIRED]
          example: "AVAILABLE"

    BillDTO:
      type: object
      required:
        - billId
        - patientId
        - patientName
        - amount
        - paymentStatus
        - billDate
      properties:
        billId:
          type: string
          example: "BIL-0001"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        amount:
          type: number
          format: double
          example: 12500.00
        paymentStatus:
          type: string
          enum: [PAID, PENDING, PARTIAL, CANCELLED]
          example: "PENDING"
        billDate:
          type: string
          format: date-time
          example: "2026-10-22T16:00:00Z"
        description:
          type: string
          example: "Inpatient stay 2 nights (Ward 4A) + FBC Lab Test + Medication"

    Tier2RecordDTO:
      type: object
      required:
        - recordId
        - workflowType
        - patientId
        - patientName
        - timestamp
        - details
      properties:
        recordId:
          type: string
          example: "T2-RAD-0001"
        workflowType:
          type: string
          enum: [RADIOLOGY, MATERNITY, ETU, CLINIC, MEDICAL_UNIT]
          example: "RADIOLOGY"
        patientId:
          type: string
          example: "PAT-0001"
        patientName:
          type: string
          example: "John Doe"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-22T10:00:00Z"
        details:
          type: object
          description: Workflow specific fields (e.g., equipmentName, emergencyLevel, etc.)
          example:
            equipmentName: "3T MRI Siemens"
            scanType: "Brain MRI with Contrast"
            status: "Completed"

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and obtain JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Patient self-registration (Creates PATIENT account only)
      operationId: registerPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegisterRequest'
      responses:
        '201':
          description: Patient successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /patients:
    get:
      tags: [Patients]
      summary: List all registered patients with pagination and search
      operationId: listPatients
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Search term (name, patientId, phone)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated patient list
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientDTO'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  last:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Patients]
      summary: Administratively register a new patient
      operationId: createPatient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientDTO'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDTO'

  /patients/me:
    get:
      tags: [Patients]
      summary: Retrieve current authenticated patient's profile
      operationId: getCurrentPatientProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDTO'
        '403':
          description: Caller is not a Patient account

  /patients/me/appointments:
    get:
      tags: [Patients]
      summary: Retrieve current authenticated patient's appointments (view-only)
      operationId: getCurrentPatientAppointments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of own appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentDTO'

  /patients/me/medical-records:
    get:
      tags: [Patients]
      summary: Retrieve current authenticated patient's medical history
      operationId: getCurrentPatientRecords
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient medical records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicalRecordDTO'

  /patients/me/admission:
    get:
      tags: [Patients]
      summary: Retrieve current inpatient admission and bed allocation if admitted
      operationId: getCurrentPatientAdmission
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active admission details or null if outpatient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDTO'

  /patients/me/bills:
    get:
      tags: [Patients]
